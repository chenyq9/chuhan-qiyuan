name: Test and Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ========== 阶段1：逻辑层单元测试（JVM） ==========
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Kotlin compiler
        run: |
          curl -sL -o kotlin-compiler.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.20/kotlin-compiler-2.0.20.zip
          unzip -q kotlin-compiler.zip -d kotlinc_home

      - name: Download serialization jars (JVM variants)
        run: |
          curl -sL -o ksj.jar  https://repo1.maven.org/maven2/org/jetbrains/kotlinx/kotlinx-serialization-json-jvm/1.6.3/kotlinx-serialization-json-jvm-1.6.3.jar
          curl -sL -o ksc.jar  https://repo1.maven.org/maven2/org/jetbrains/kotlinx/kotlinx-serialization-core-jvm/1.6.3/kotlinx-serialization-core-jvm-1.6.3.jar

      - name: Run engine tests
        run: |
          CP=ksj.jar:ksc.jar
          kotlinc_home/kotlinc/bin/kotlinc -cp $CP \
            app/src/main/java/com/chuhan/qiyuan/engine/XiangqiEngine.kt \
            app/src/main/java/com/chuhan/qiyuan/ai/PromptBuilder.kt \
            EngineTest.kt -include-runtime -d test.jar 2> compile.log
          if [ $? -ne 0 ]; then cat compile.log; exit 1; fi
          java -cp test.jar:$CP EngineTestKt

  # ========== 阶段2：模拟器 UI 测试 ==========
  instrumented-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle with Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          path: app/build/reports/androidTests/connected/
          if-no-files-found: ignore

  # ========== 阶段3：构建 APK（依赖前两段全绿） ==========
  build:
    needs: [ unit-test, instrumented-test ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle with Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chuhan-qiyuan-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
